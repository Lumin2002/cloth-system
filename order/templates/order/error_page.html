{% extends extends_template %}
{% block title %}{{ error_code }} - {{ error_title }}{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="text-center py-5">
        <div class="display-1 fw-bold text-primary">{{ error_code }}</div>
        <h3 class="mt-3">{{ error_title }}</h3>
        <p class="text-muted mt-3 mb-0">{{ error_message }}</p>
        <div class="mt-4">
            <a href="javascript:history.back()" class="btn btn-outline-secondary me-2">返回上一页</a>
            {% if is_supplier %}
            <a href="{% url 'supplier_dashboard' %}" class="btn btn-primary">返回供应商面板</a>
            {% elif user.is_authenticated %}
            <a href="{% url 'dashboard' %}" class="btn btn-primary">返回首页</a>
            {% else %}
            <a href="{% url 'home' %}" class="btn btn-primary">返回首页</a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}

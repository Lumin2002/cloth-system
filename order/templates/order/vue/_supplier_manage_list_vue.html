<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
{% include 'order/vue/_vue_pagination_component.html' %}
<script>
(function () {
    if (typeof Vue === 'undefined') return;
    var dataElement = document.getElementById('supplier-manage-data');
    if (!dataElement) return;
    var suppliers = [];
    try { suppliers = JSON.parse(dataElement.textContent); } catch (e) { suppliers = []; }

    var app = Vue.createApp({
        delimiters: ['[[', ']]'],
        data: function () {
            return {
                suppliers: suppliers,
                search: '',
                status: 'all',
                currentPage: 1,
                pageSize: 20
            };
        },
        computed: {
            filteredSuppliers: function () {
                var keyword = this.search.trim().toLowerCase();
                return this.suppliers.filter(function (supplier) {
                    var statusMatched = true;
                    if (this.status === 'active') {
                        statusMatched = supplier.is_active;
                    } else if (this.status === 'inactive') {
                        statusMatched = !supplier.is_active;
                    }

                    var textMatched = true;
                    if (keyword) {
                        textMatched = [
                            supplier.company_name,
                            supplier.username,
                            supplier.contact_person,
                            supplier.phone
                        ].join(' ').toLowerCase().indexOf(keyword) !== -1;
                    }
                    return statusMatched && textMatched;
                }, this);
            },
            totalPages: function () {
                return Math.max(1, Math.ceil(this.filteredSuppliers.length / this.pageSize));
            },
            pagedSuppliers: function () {
                var start = (this.currentPage - 1) * this.pageSize;
                return this.filteredSuppliers.slice(start, start + this.pageSize);
            }
        },
        watch: {
            search: function () {
                this.currentPage = 1;
            },
            status: function () {
                this.currentPage = 1;
            }
        },
        methods: {
            goPage: function (page) {
                if (page >= 1 && page <= this.totalPages) this.currentPage = page;
            },
            prevPage: function () {
                this.goPage(this.currentPage - 1);
            },
            nextPage: function () {
                this.goPage(this.currentPage + 1);
            }
        },
        template: `
            <div>
                <div class="row g-2 mb-3">
                    <div class="col-md-4">
                        <input v-model="search" type="text" class="form-control form-control-sm" placeholder="搜索公司名称/联系人/登录名...">
                    </div>
                    <div class="col-auto">
                        <select v-model="status" class="form-select form-select-sm">
                            <option value="all">全部状态</option>
                            <option value="active">激活</option>
                            <option value="inactive">禁用</option>
                        </select>
                    </div>
                    <div class="col-auto text-muted small d-flex align-items-center">显示 [[ filteredSuppliers.length ]] 个账号</div>
                </div>

                <div class="card card-flat">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>公司名称</th>
                                    <th>登录账号</th>
                                    <th>联系人</th>
                                    <th>电话</th>
                                    <th>状态</th>
                                    <th>创建时间</th>
                                    <th class="text-end">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="supplier in pagedSuppliers" :key="supplier.id">
                                    <td class="fw-semibold text-primary text-nowrap">[[ supplier.company_name ]]</td>
                                    <td class="small"><code>[[ supplier.username ]]</code></td>
                                    <td class="small text-nowrap">[[ supplier.contact_person || '-' ]]</td>
                                    <td class="small text-nowrap">[[ supplier.phone || '-' ]]</td>
                                    <td>
                                        <span class="badge" :class="supplier.is_active ? 'bg-success' : 'bg-secondary'">
                                            [[ supplier.is_active ? '激活' : '禁用' ]]
                                        </span>
                                    </td>
                                    <td class="small text-muted text-nowrap">[[ supplier.created_at ]]</td>
                                    <td class="text-end">
                                        <div class="d-flex flex-nowrap gap-1 justify-content-end">
                                            <a :href="supplier.edit_url" class="btn btn-sm btn-outline-primary">编辑</a>
                                            <a :href="supplier.reset_password_url" class="btn btn-sm btn-outline-warning">重置密码</a>
                                            <a :href="supplier.delete_url" class="btn btn-sm btn-outline-danger">删除</a>
                                        </div>
                                    </td>
                                </tr>
                                <tr v-if="!pagedSuppliers.length">
                                    <td colspan="7" class="text-center text-muted py-4">暂无供应商账号</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <pagination-bar :current-page="currentPage" :total-pages="totalPages" @page-change="goPage"></pagination-bar>
            </div>
        `
    });
    app.component('pagination-bar', window.__paginationBarComponent);
    app.mount('#supplier-manage-vue');
})();
</script>

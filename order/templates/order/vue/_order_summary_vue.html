<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
(function () {
    if (typeof Vue === 'undefined') return;
    var dataElement = document.getElementById('order-summary-data');
    if (!dataElement) return;
    var summary = {};
    try { summary = JSON.parse(dataElement.textContent); } catch (e) { summary = {}; }

    Vue.createApp({
        delimiters: ['[[', ']]'],
        data: function () {
            return { summary: summary };
        },
        methods: {
            money: function (value) {
                return '¥' + Number(value || 0).toLocaleString('zh-CN', { maximumFractionDigits: 0 });
            },
            percent: function (value) {
                return Number(value || 0).toFixed(1);
            }
        },
        template: `
            <div class="row g-3 mb-4">
                <div class="col-6 col-xl-3">
                    <div class="kpi-card kpi-primary">
                        <div class="kpi-label">筛选结果</div>
                        <div class="kpi-value">[[ summary.total_count ]]</div>
                        <div class="kpi-meta">条订单</div>
                        <i class="bi bi-clipboard-data kpi-icon"></i>
                    </div>
                </div>
                <div class="col-6 col-xl-3">
                    <div class="kpi-card kpi-success">
                        <div class="kpi-label">营收合计</div>
                        <div class="kpi-value">[[ money(summary.total_revenue) ]]</div>
                        <div class="kpi-meta">成品总金额</div>
                        <i class="bi bi-graph-up-arrow kpi-icon"></i>
                    </div>
                </div>
                <div class="col-6 col-xl-3">
                    <div class="kpi-card kpi-warning">
                        <div class="kpi-label">成本合计</div>
                        <div class="kpi-value">[[ money(summary.total_cost) ]]</div>
                        <div class="kpi-meta">采购/成本金额</div>
                        <i class="bi bi-wallet2 kpi-icon"></i>
                    </div>
                </div>
                <div class="col-6 col-xl-3">
                    <div class="kpi-card kpi-info">
                        <div class="kpi-label">利润合计</div>
                        <div class="kpi-value">[[ money(summary.total_profit) ]]</div>
                        <div class="kpi-meta">利润率约 [[ percent(summary.profit_margin) ]]%</div>
                        <i class="bi bi-piggy-bank kpi-icon"></i>
                    </div>
                </div>
            </div>
        `
    }).mount('#order-summary-vue');
})();
</script>

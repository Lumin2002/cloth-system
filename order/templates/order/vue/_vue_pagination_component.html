<script>
(function () {
    if (typeof Vue === 'undefined' || window.__vuePaginationComponent) return;
    window.__paginationBarComponent = {
        delimiters: ['[[', ']]'],
        props: {
            currentPage: {
                type: Number,
                default: 1
            },
            totalPages: {
                type: Number,
                default: 1
            }
        },
        emits: ['page-change'],
        data: function () {
            return {
                jumpPage: this.currentPage
            };
        },
        watch: {
            currentPage: function (value) {
                this.jumpPage = value;
            }
        },
        computed: {
            pageItems: function () {
                var total = this.totalPages;
                var current = this.currentPage;
                if (total <= 7) {
                    return Array.from({ length: total }, function (_, i) { return i + 1; });
                }
                var pages = [];
                for (var i = 1; i <= total; i++) {
                    if (i === 1 || i === total || (i >= current - 1 && i <= current + 1)) {
                        pages.push(i);
                    } else if (pages[pages.length - 1] !== '...') {
                        pages.push('...');
                    }
                }
                return pages;
            }
        },
        methods: {
            goPage: function (page) {
                if (page >= 1 && page <= this.totalPages) {
                    this.$emit('page-change', page);
                }
            },
            prevPage: function () {
                this.goPage(this.currentPage - 1);
            },
            nextPage: function () {
                this.goPage(this.currentPage + 1);
            },
            jumpTo: function () {
                var page = parseInt(this.jumpPage, 10);
                if (!isNaN(page)) {
                    this.goPage(page);
                } else {
                    this.jumpPage = this.currentPage;
                }
            }
        },
        template: `
            <div v-if="totalPages > 1" class="d-flex flex-wrap align-items-center justify-content-center gap-2 mt-4 px-3 py-2 bg-white border rounded shadow-sm">
                <button type="button" class="btn btn-sm btn-outline-secondary" :disabled="currentPage === 1" @click="prevPage">上一页</button>
                <template v-for="page in pageItems" :key="page">
                    <button v-if="page !== '...'" type="button" class="btn btn-sm rounded-circle" :class="page === currentPage ? 'btn-primary' : 'btn-light border'" @click="goPage(page)" style="min-width:34px;">[[ page ]]</button>
                    <span v-else class="text-muted px-1">...</span>
                </template>
                <button type="button" class="btn btn-sm btn-outline-secondary" :disabled="currentPage === totalPages" @click="nextPage">下一页</button>
                <span class="small text-muted ms-2">第 [[ currentPage ]] / [[ totalPages ]] 页</span>
                <div class="d-flex align-items-center ms-2">
                    <span class="small text-muted me-1">跳至</span>
                    <input v-model.number="jumpPage" type="number" min="1" :max="totalPages" class="form-control form-control-sm text-center" style="width:70px;" @keyup.enter="jumpTo">
                    <span class="small text-muted mx-1">页</span>
                    <button type="button" class="btn btn-sm btn-outline-primary" @click="jumpTo">跳转</button>
                </div>
            </div>
        `
    };
    window.__vuePaginationComponent = true;
})();
</script>

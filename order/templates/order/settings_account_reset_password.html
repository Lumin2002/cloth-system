{% extends 'order/settings_base.html' %}

{% block title %}重置管理员密码 - 系统设置{% endblock %}

{% block settings_content %}
<h5 class="fw-bold mb-1"><i class="bi bi-key me-2 text-primary"></i>重置管理员密码</h5>
<p class="text-muted small mb-3">正在为账号 <strong>{{ account.username }}</strong> 设置新密码。</p>

<form method="post" novalidate>
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">管理员</label>
        <input type="text" class="form-control" value="{{ account.username }}{% if account.first_name %}（{{ account.first_name }}）{% endif %}" disabled>
    </div>

    <div class="mb-3">
        <label class="form-label" for="new_password">新密码<span class="text-danger">*</span></label>
        <input type="password" name="new_password" id="new_password" class="form-control" required minlength="6" autocomplete="new-password">
        <div class="form-text">至少 6 位</div>
    </div>

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-warning btn-sm">重置密码</button>
        <a href="{% url 'system_settings' %}" class="btn btn-secondary btn-sm">取消</a>
    </div>
</form>
{% endblock %}

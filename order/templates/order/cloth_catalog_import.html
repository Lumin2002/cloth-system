{% extends "order/base.html" %}
{% block title %}导入布种编号{% endblock %}
{% block content %}
<div class="container-fluid main-container">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb mb-0">
      <li class="breadcrumb-item"><a href="{% url 'cloth_catalog_list' %}">布种编号表</a></li>
      <li class="breadcrumb-item active">导入Excel</li>
    </ol>
  </nav>

  <div class="card card-flat">
    <div class="card-header"><h6 class="mb-0"><i class="bi bi-upload me-2 text-primary"></i>导入布种编号表</h6></div>
    <div class="card-body">
      <form id="importForm" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">选择 Excel 文件（.xlsx）</label>
          <input type="file" name="excel_file" class="form-control" accept=".xlsx" required>
        </div>
        <button type="submit" class="btn btn-outline-primary btn-sm" id="importBtn">开始导入</button>
      </form>

      <div id="progressArea" class="mt-3 d-none">
        <div class="d-flex justify-content-between mb-1">
          <span id="progressMsg" class="small">处理中...</span>
          <span id="progressPct" class="small fw-bold">0%</span>
        </div>
        <div class="progress" style="height: 20px;">
          <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%;">0%</div>
        </div>
      </div>

      <div id="importResult" class="mt-3 d-none"></div>
    </div>
  </div>
</div>
<script>
function readJson(resp) {
  return resp.text().then(function (text) {
    try {
      return JSON.parse(text);
    } catch (e) {
      var hint = (resp.redirected || resp.status === 401 || resp.status === 403)
        ? "登录状态或安全令牌已失效，请刷新页面后重试"
        : "服务器返回异常（HTTP " + resp.status + "），请稍后重试";
      throw new Error(hint);
    }
  });
}

// 用 DOM + textContent 构造提示，避免直接把后端消息当 HTML 插入
function showAlert(message, type) {
  var box = document.getElementById("importResult");
  box.classList.remove("d-none");
  box.textContent = "";
  var div = document.createElement("div");
  div.className = "alert alert-" + (type || "danger");
  div.textContent = message;
  box.appendChild(div);
  return box;
}

document.getElementById("importForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const btn = document.getElementById("importBtn");
  btn.disabled = true; btn.textContent = "上传中...";

  let data;
  try {
    const resp = await fetch("{% url "cloth_catalog_import_start" %}", {
      method: "POST",
      headers: { "X-Requested-With": "XMLHttpRequest" },
      body: new FormData(this),
    });
    data = await readJson(resp);
    if (!resp.ok && !data.error) throw new Error("启动导入失败（HTTP " + resp.status + "）");
  } catch (err) {
    showAlert(err.message || "启动导入失败");
    btn.disabled = false; btn.textContent = "开始导入";
    return;
  }
  if (data.error) {
    showAlert(data.error);
    btn.disabled = false; btn.textContent = "开始导入";
    return;
  }

  const taskId = data.task_id;
  document.getElementById("importForm").style.display = "none";
  document.getElementById("progressArea").classList.remove("d-none");

  pollProgress(taskId);
});

function pollProgress(taskId) {
  fetch("/cloth-catalog/import/progress/" + taskId + "/", { headers: { "X-Requested-With": "XMLHttpRequest" } })
    .then(readJson)
    .then(function(state) {
      if (state.error && !state.status) {
        showAlert(state.error);
        return;
      }
      var pct = state.percent || 0;
      var bar = document.getElementById("progressBar");
      bar.style.width = pct + "%";
      bar.textContent = pct + "%";
      document.getElementById("progressPct").textContent = pct + "%";
      document.getElementById("progressMsg").textContent = state.message || "处理中...";

      if (state.status === "done" || state.status === "error") {
        bar.classList.remove("progress-bar-animated");
        if (state.status === "done" && state.result) {
          bar.classList.add("bg-success");
          var box = showAlert("导入完成！新增 " + state.result.imported + " 条，更新 " + state.result.updated + " 条", "success");
          var link = document.createElement("a");
          link.href = "{% url "cloth_catalog_list" %}";
          link.className = "btn btn-sm btn-outline-primary";
          link.textContent = "查看列表";
          box.appendChild(link);
        } else if (state.status === "error") {
          bar.classList.add("bg-danger");
          showAlert("导入失败：" + (state.error || "未知错误"));
        }
        return;
      }

      setTimeout(function() { pollProgress(taskId); }, 500);
    })
    .catch(function(err) {
      showAlert(err.message || "无法获取导入进度，请刷新页面后重试");
    });
}
</script>
{% endblock %}

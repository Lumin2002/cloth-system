{% extends "order/base.html" %}
{% block title %}重置密码{% endblock %}
{% block content %}
<div class="container-fluid main-container">
<div class="row justify-content-center"><div class="col-lg-5">
<div class="card card-flat"><div class="card-header"><h5 class="mb-0"><i class="bi bi-key me-2"></i>重置密码</h5></div>
<div class="card-body">
<p class="mb-3">供应商：<strong>{{ supplier.company_name }}</strong>（登录名：<code>{{ supplier.user.username }}</code>）</p>
<form method="post">{% csrf_token %}
<div class="mb-3"><label class="form-label fw-bold">新密码</label>
<input type="text" name="new_password" class="form-control" required placeholder="输入新密码..."></div>
<div class="d-flex gap-2">
<button type="submit" class="btn btn-warning"><i class="bi bi-check-lg me-1"></i>确认重置</button>
<a href="{% url 'supplier_manage_list' %}" class="btn btn-outline-secondary">取消</a>
</div></form></div></div></div></div></div>
{% endblock %}

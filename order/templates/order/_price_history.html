<script>
(function () {
    var orderType = document.getElementById('id_order_type');
    var priceInput = document.getElementById('id_price');
    if (!orderType || !priceInput) return;

    var panel = document.createElement('div');
    panel.id = 'price-history-panel';
    panel.className = 'mt-2 small';
    panel.dataset.exclude = '{% if object %} {{ object.pk }}{% endif %}';
    panel.style.display = 'none';
    priceInput.parentNode.insertBefore(panel, priceInput.nextSibling);

    function valueOf(id) {
        var el = document.getElementById(id);
        return el ? el.value.trim() : '';
    }

    function escapeHtml(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function loadHistory() {
        var type = orderType.value.trim();
        if (!type) {
            panel.style.display = 'none';
            panel.innerHTML = '';
            return;
        }

        var params = new URLSearchParams({order_type: type});
        var clothType = valueOf('id_cloth_type');
        var customer = valueOf('id_customer');
        var color = valueOf('id_color');
        var exclude = panel.dataset.exclude.trim();
        if (clothType) params.set('cloth_type', clothType);
        if (customer) params.set('customer', customer);
        if (color) params.set('color', color);
        if (exclude) params.set('exclude', exclude);

        fetch("{% url 'order_price_history' %}?" + params.toString())
            .then(function (response) { return response.json(); })
            .then(function (data) {
                var history = data.history || [];
                if (!history.length) {
                    panel.innerHTML =
                        '<div class="card border-secondary">' +
                        '<div class="card-header bg-secondary bg-opacity-10 py-1 px-2 small fw-bold">' +
                        '<i class="bi bi-clock-history me-1"></i>历史价格参考（最近5次）' +
                        '</div>' +
                        '<div class="card-body p-2 text-muted small">该布种暂无历史订单价格</div>' +
                        '</div>';
                    panel.style.display = 'block';
                    return;
                }

                var rows = history.map(function (item) {
                    var info = [
                        item.order_date ? item.order_date.slice(0, 10) : '',
                        item.customer,
                        item.cloth_type,
                        item.color
                    ].filter(Boolean).join(' / ');
                    return '<div class="price-history-row d-flex justify-content-between align-items-center border rounded px-2 py-1 mb-1" ' +
                        'style="cursor:pointer;background:#f8f9fa;" ' +
                        'data-price="' + escapeHtml(item.price) + '" ' +
                        'data-unit="' + escapeHtml(item.price_unit) + '" ' +
                        'data-qty-unit="' + escapeHtml(item.quantity_unit) + '">' +
                        '<span class="text-muted text-truncate me-2">' +
                        '<span class="badge bg-secondary me-1">' + escapeHtml(item.order_type) + '</span>' +
                        '<strong>#' + escapeHtml(item.serial_number) + '</strong> ' + escapeHtml(info) +
                        '</span>' +
                        '<span class="text-primary fw-bold text-nowrap">' +
                        escapeHtml(item.price) + ' ' + escapeHtml(item.price_unit) +
                        '</span></div>';
                }).join('');

                panel.innerHTML =
                    '<div class="card border-info">' +
                    '<div class="card-header bg-info bg-opacity-10 py-1 px-2 small fw-bold">' +
                    '<i class="bi bi-clock-history me-1"></i>历史价格参考（最近5次）' +
                    '</div>' +
                    '<div class="card-body p-1">' + rows + '</div>' +
                    '</div>';
                panel.style.display = 'block';

                Array.prototype.forEach.call(panel.querySelectorAll('.price-history-row'), function (row) {
                    row.addEventListener('click', function () {
                        var price = document.getElementById('id_price');
                        var unit = document.getElementById('id_price_unit');
                        var quantityUnit = document.getElementById('id_quantity_unit');
                        if (price && this.dataset.price) price.value = this.dataset.price;
                        if (unit && this.dataset.unit) unit.value = this.dataset.unit;
                        if (quantityUnit && this.dataset.qtyUnit) quantityUnit.value = this.dataset.qtyUnit;
                    });
                });
            })
            .catch(function () {
                panel.style.display = 'none';
                panel.innerHTML = '';
            });
    }

    orderType.addEventListener('change', loadHistory);
    var clothInput = document.getElementById('id_cloth_type');
    var customerInput = document.getElementById('id_customer');
    var colorInput = document.getElementById('id_color');
    if (clothInput) clothInput.addEventListener('change', loadHistory);
    if (customerInput) customerInput.addEventListener('change', loadHistory);
    if (colorInput) colorInput.addEventListener('change', loadHistory);

    loadHistory();
})();
</script>

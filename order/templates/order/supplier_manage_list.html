{% extends "order/base.html" %}
{% block title %}供应商账号管理{% endblock %}
{% block content %}
<div class="container-fluid main-container">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb mb-0">
      <li class="breadcrumb-item"><a href="{% url 'dashboard' %}">仪表板</a></li>
      <li class="breadcrumb-item active">供应商账号</li>
    </ol>
  </nav>

  <div class="page-hero mb-4">
    <div class="row align-items-center">
      <div class="col-lg-8">
        <h2 class="fw-bold mb-1"><i class="bi bi-people text-primary me-2"></i>供应商账号</h2>
        <p class="text-muted mb-0">共 {{ total }} 个账号，激活 {{ active_count }} 个</p>
      </div>
      <div class="col-lg-4 mt-3 mt-lg-0">
        <div class="d-flex flex-wrap gap-2 justify-content-lg-end">
          <a href="{% url 'supplier_manage_add' %}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>新建供应商</a>
        </div>
      </div>
    </div>
  </div>

  <div id="supplier-manage-vue"></div>
  {{ suppliers_json|json_script:"supplier-manage-data" }}
  {% include 'order/_supplier_manage_list_vue.html' %}
</div>
{% endblock %}

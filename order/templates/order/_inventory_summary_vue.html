<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
(function () {
    if (typeof Vue === 'undefined') return;
    var dataElement = document.getElementById('inventory-summary-data');
    if (!dataElement) return;
    var summary = {};
    try { summary = JSON.parse(dataElement.textContent); } catch (e) { summary = {}; }

    Vue.createApp({
        delimiters: ['[[', ']]'],
        data: function () {
            return { summary: summary };
        },
        template: `
            <div class="row g-3 mb-4">
                <div class="col-6 col-xl-3">
                    <div class="kpi-card kpi-primary">
                        <div class="kpi-label">筛选结果</div>
                        <div class="kpi-value">[[ summary.total_count ]]</div>
                        <div class="kpi-meta">条记录</div>
                        <i class="bi bi-boxes kpi-icon"></i>
                    </div>
                </div>
                <div class="col-6 col-xl-3">
                    <div class="kpi-card kpi-success">
                        <div class="kpi-label">总库存数量</div>
                        <div class="kpi-value">[[ summary.total_quantity ]]</div>
                        <div class="kpi-meta">码</div>
                        <i class="bi bi-stack kpi-icon"></i>
                    </div>
                </div>
                <div class="col-6 col-xl-3">
                    <div class="kpi-card kpi-warning">
                        <div class="kpi-label">低库存</div>
                        <div class="kpi-value">[[ summary.chip_low ]]</div>
                        <div class="kpi-meta">数量 1–49 码</div>
                        <i class="bi bi-exclamation-triangle kpi-icon"></i>
                    </div>
                </div>
                <div class="col-6 col-xl-3">
                    <div class="kpi-card kpi-danger">
                        <div class="kpi-label">零库存</div>
                        <div class="kpi-value">[[ summary.chip_zero ]]</div>
                        <div class="kpi-meta">数量为 0</div>
                        <i class="bi bi-x-circle kpi-icon"></i>
                    </div>
                </div>
            </div>
        `
    }).mount('#inventory-summary-vue');
})();
</script>

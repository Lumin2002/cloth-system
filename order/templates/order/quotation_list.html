{% extends "order/base.html" %}
{% block title %}面料报价表{% endblock %}
{% block content %}
<div class="container-fluid main-container">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb mb-0">
      <li class="breadcrumb-item"><a href="{% url 'dashboard' %}">仪表板</a></li>
      <li class="breadcrumb-item active">面料报价表</li>
    </ol>
  </nav>

  <div class="page-hero mb-4">
    <div class="row align-items-center g-2">
      <div class="col-lg-8">
        <h2 class="fw-bold mb-1"><i class="bi bi-currency-dollar text-primary me-2"></i>面料报价表</h2>
        <p class="text-muted mb-0">共 <strong>{{ total }}</strong> 条报价记录</p>
      </div>
      <div class="col-lg-4">
        <div class="d-flex flex-wrap gap-2 justify-content-lg-end">
          <a href="{% url 'quotation_add' %}" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i> 新增</a>
          <a href="{% url 'quotation_import' %}" class="btn btn-outline-success btn-sm"><i class="bi bi-upload me-1"></i> 导入</a>
          <form method="post" action="{% url 'quotation_delete_all' %}" class="d-inline"
                onsubmit="return confirm('确认要删除全部面料报价记录吗？此操作不可撤销！')">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash-fill me-1"></i> 清空</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="quotation-vue"></div>
  {{ items_json|json_script:"quotation-data" }}
  {% include 'order/_quotation_list_vue.html' %}
</div>
{% endblock %}
